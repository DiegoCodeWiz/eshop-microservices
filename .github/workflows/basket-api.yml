name: Deploy Basket API to Azure

on:
  push:
    branches: [main]
    paths:
      - "src/Basket/Basket.API/**"
      - "src/BuildingBlocks/**"
      - ".github/workflows/basket-api.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restaurar dependencias
        run: dotnet restore src/Basket/Basket.API/Basket.API.csproj

      - name: Compilar
        run: dotnet build src/Basket/Basket.API/Basket.API.csproj --configuration Release --no-restore

      - name: Publicar archivos
        run: dotnet publish src/Basket/Basket.API/Basket.API.csproj --configuration Release --no-build --output ./publish/basket

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BASKET_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BASKET_PUBLISH_PROFILE }}
          package: ./publish/basket
